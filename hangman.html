    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            font-family: 'Outfit', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08090d;
            color: #ffffff;
            position: fixed; /* Prevents scroll bounces on mobile iOS */
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism Panel Tokens */
        .glass-panel {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
        }

        .glow-box {
            box-shadow: 0 0 24px rgba(6, 182, 212, 0.2);
        }

        /* Keyboard Buttons */
        .key-btn {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }

        .key-btn:active {
            transform: scale(0.92);
        }

        .key-correct {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            border-color: #34d399 !important;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5) !important;
            color: #ffffff !important;
            opacity: 0.85;
            cursor: not-allowed !important;
        }

        .key-wrong {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
            border-color: #f87171 !important;
            opacity: 0.2;
            cursor: not-allowed !important;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 6px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 10px #06b6d4;
        }

        /* Responsive Layout Tweaks for Landscape Mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            #ui-container {
                padding: 0.5rem !important;
            }
            .header-panel {
                padding: 0.25rem 0.75rem !important;
            }
            #word-display {
                padding: 0.35rem 0.75rem !important;
                margin-top: 0.25rem;
                margin-bottom: 0.25rem;
            }
            .word-slot {
                width: 1.75rem !important;
                height: 2.25rem !important;
                font-size: 1rem !important;
            }
            .keyboard-wrapper {
                padding: 0.35rem !important;
            }
            .key-btn {
                height: 2rem !important;
                font-size: 0.75rem !important;
            }
        }
    </style>

        // --- WEB AUDIO API PROCEDURAL AUDIO ENGINE ---
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.musicGain = null;
                this.sfxGain = null;
                this.isMusicOn = true;
                this.musicVol = 0.5;
                this.sfxVol = 0.7;
                this.isPlayingMusic = false;
                this.bgmTimer = null;
            }

            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();

                this.musicGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();

                this.updateVolumes();

                this.musicGain.connect(this.ctx.destination);
                this.sfxGain.connect(this.ctx.destination);
            }

            updateVolumes() {
                if (!this.ctx) return;
                this.musicGain.gain.setValueAtTime(this.isMusicOn ? this.musicVol * 0.25 : 0, this.ctx.currentTime);
                this.sfxGain.gain.setValueAtTime(this.sfxVol, this.ctx.currentTime);
            }

            startBGM() {
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (this.isPlayingMusic) return;
                this.isPlayingMusic = true;

                const notes = [220, 261.63, 329.63, 392.00, 440, 523.25];
                let step = 0;

                const playNote = () => {
                    if (!this.isPlayingMusic) return;
                    
                    try {
                        const osc = this.ctx.createOscillator();
                        const noteGain = this.ctx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(notes[step % notes.length], this.ctx.currentTime);
                        
                        noteGain.gain.setValueAtTime(0, this.ctx.currentTime);
                        noteGain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 0.3);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.8);

                        osc.connect(noteGain);
                        noteGain.connect(this.musicGain);

                        osc.start();
                        osc.stop(this.ctx.currentTime + 1.8);

                        step++;
                        this.bgmTimer = setTimeout(playNote, 600);
                    } catch (e) {
                        console.warn("Audio Context handling", e);
                    }
                };

                playNote();
            }

            stopBGM() {
                this.isPlayingMusic = false;
                if (this.bgmTimer) clearTimeout(this.bgmTimer);
            }

            playClick() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.sfxGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playCorrect() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.35, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(this.sfxGain);
                osc.start();
                osc.stop(now + 0.3);
            }

            playWrong() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.sfxGain);
                osc.start();
                osc.stop(now + 0.25);
            }

            playWin() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const startTime = this.ctx.currentTime + idx * 0.12;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.35, startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);

                    osc.connect(gain);
                    gain.connect(this.sfxGain);
                    osc.start(startTime);
                    osc.stop(startTime + 0.4);
                });
            }

            playLoss() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const notes = [280, 240, 200, 160];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const startTime = this.ctx.currentTime + idx * 0.15;

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.linearRampToValueAtTime(0.01, startTime + 0.2);

                    osc.connect(gain);
                    gain.connect(this.sfxGain);
                    osc.start(startTime);
                    osc.stop(startTime + 0.2);
                });
            }
        }

        const audio = new AudioEngine();

        // --- GAME STATE VARIABLES ---
        let availablePool = [...WORDS_DATABASE];
        let currentWordObj = null;
        let guessedLetters = new Set();
        let wrongGuesses = 0;
        const MAX_WRONG = 6;
        let gameActive = false;

        // --- THREE.JS ENGINE & RESPONSIVE CAMERA SYSTEM ---
        let scene, camera, renderer;
        let gallowsGroup, characterGroup;
        let bodyParts = [];

        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x08090d);
            scene.fog = new THREE.FogExp2(0x08090d, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.55);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.25);
            dirLight.position.set(6, 12, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const rimLight = new THREE.PointLight(0x06b6d4, 2.8, 14);
            rimLight.position.set(-4, 4, -2);
            scene.add(rimLight);

            // Circular Base Floor
            const groundGeo = new THREE.CircleGeometry(14, 64);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.2 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            build3DGallows();
            build3DCharacter();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Calculates Camera Position and FOV dynamically to prevent clipping on Mobile Portrait or Ultra-Wide Screens
        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            
            if (aspect < 0.8) {
                // Portrait Mobile
                camera.fov = 55;
                camera.position.set(0, 4.8, 14.5);
                camera.lookAt(0, 2.6, 0);
            } else if (aspect < 1.2) {
                // Square/Tablet
                camera.fov = 48;
                camera.position.set(0, 4.5, 12.5);
                camera.lookAt(0, 2.5, 0);
            } else {
                // Desktop Landscape
                camera.fov = 42;
                camera.position.set(0, 4.2, 11);
                camera.lookAt(0, 2.3, 0);
            }
            camera.updateProjectionMatrix();
        }

        function build3DGallows() {
            gallowsGroup = new THREE.Group();

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x3f2e21, roughness: 0.85 });
            const ropeMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.9 });

            const base = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.3, 2.5), woodMat);
            base.position.set(-1, 0.15, 0);
            base.castShadow = true;
            base.receiveShadow = true;
            gallowsGroup.add(base);

            const pole = new THREE.Mesh(new THREE.BoxGeometry(0.35, 6.2, 0.35), woodMat);
            pole.position.set(-2.5, 3.25, 0);
            pole.castShadow = true;
            gallowsGroup.add(pole);

            const topBeam = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.35, 0.35), woodMat);
            topBeam.position.set(-0.8, 6.2, 0);
            topBeam.castShadow = true;
            gallowsGroup.add(topBeam);

            const brace = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.8, 0.25), woodMat);
            brace.position.set(-2.0, 5.4, 0);
            brace.rotation.z = -Math.PI / 4;
            brace.castShadow = true;
            gallowsGroup.add(brace);

            const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, 12), ropeMat);
            rope.position.set(0.6, 5.4, 0);
            rope.castShadow = true;
            gallowsGroup.add(rope);

            scene.add(gallowsGroup);
        }

        function build3DCharacter() {
            characterGroup = new THREE.Group();
            characterGroup.position.set(0.6, 0, 0);

            const charMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x06b6d4, 
                roughness: 0.2, 
                metalness: 0.5,
                emissive: 0x0284c7,
                emissiveIntensity: 0.2
            });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 32, 32), charMaterial);
            head.position.set(0, 4.4, 0);
            head.castShadow = true;

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 1.5, 16), charMaterial);
            torso.position.set(0, 3.2, 0);
            torso.castShadow = true;

            const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 1.1, 12), charMaterial);
            leftArm.position.set(-0.42, 3.4, 0);
            leftArm.rotation.z = Math.PI / 3.5;
            leftArm.castShadow = true;

            const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 1.1, 12), charMaterial);
            rightArm.position.set(0.42, 3.4, 0);
            rightArm.rotation.z = -Math.PI / 3.5;
            rightArm.castShadow = true;

            const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 1.3, 12), charMaterial);
            leftLeg.position.set(-0.3, 1.9, 0);
            leftLeg.rotation.z = Math.PI / 8;
            leftLeg.castShadow = true;

            const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 1.3, 12), charMaterial);
            rightLeg.position.set(0.3, 1.9, 0);
            rightLeg.rotation.z = -Math.PI / 8;
            rightLeg.castShadow = true;

            bodyParts = [head, torso, leftArm, rightArm, leftLeg, rightLeg];

            bodyParts.forEach(part => {
                part.visible = false;
                characterGroup.add(part);
            });

            scene.add(characterGroup);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            if (gallowsGroup) {
                gallowsGroup.rotation.y = Math.sin(time * 0.5) * 0.08;
            }
            if (characterGroup) {
                characterGroup.rotation.z = Math.sin(time * 1.5) * 0.03;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            updateCameraPosition();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function initGame() {
            if (availablePool.length === 0) {
                availablePool = [...WORDS_DATABASE];
            }

            const randomIndex = Math.floor(Math.random() * availablePool.length);
            currentWordObj = availablePool.splice(randomIndex, 1)[0];

            guessedLetters.clear();
            wrongGuesses = 0;
            gameActive = true;

            // Hide Active Modals
            document.getElementById('game-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('settings-modal').classList.add('opacity-0', 'pointer-events-none');

            bodyParts.forEach(part => part.visible = false);

            document.getElementById('category-display').innerText = `Category: ${currentWordObj.category}`;
            updateLivesUI();
            renderWordDisplay();
            renderKeyboardUI();
        }

        function renderWordDisplay() {
            const container = document.getElementById('word-display');
            container.innerHTML = '';

            const word = currentWordObj.word;
            let isComplete = true;

            for (let char of word) {
                const slot = document.createElement('div');
                slot.className = "word-slot w-7 h-10 sm:w-11 sm:h-14 md:w-12 md:h-16 rounded-lg sm:rounded-xl flex items-center justify-center font-black text-base sm:text-2xl md:text-3xl border border-cyan-500/30 bg-slate-900/60 shadow-inner transition-all";

                if (guessedLetters.has(char)) {
                    slot.innerText = char;
                    slot.classList.add('text-cyan-400', 'border-cyan-400/80', 'bg-cyan-950/40', 'glow-text');
                } else {
                    slot.innerText = '';
                    slot.classList.add('text-slate-600');
                    isComplete = false;
                }

                container.appendChild(slot);
            }

            if (isComplete && gameActive) {
                endGame(true);
            }
        }

        function renderKeyboardUI() {
            const keyboardContainer = document.getElementById('keyboard');
            keyboardContainer.innerHTML = '';

            for (let i = 65; i <= 90; i++) {
                const letter = String.fromCharCode(i);
                const btn = document.createElement('button');
                btn.id = `key-${letter}`;
                btn.innerText = letter;
                btn.className = "key-btn h-9 sm:h-11 md:h-12 rounded-lg sm:rounded-xl font-bold text-xs sm:text-sm md:text-base glass-panel text-slate-200 border-slate-700 hover:border-cyan-400/60 hover:text-cyan-300 hover:bg-cyan-950/30 flex items-center justify-center shadow-md";

                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    audio.startBGM();
                    makeGuess(letter);
                });
                keyboardContainer.appendChild(btn);
            }
        }

        function makeGuess(letter) {
            if (!gameActive || guessedLetters.has(letter)) return;

            guessedLetters.add(letter);
            const keyBtn = document.getElementById(`key-${letter}`);

            if (currentWordObj.word.includes(letter)) {
                audio.playCorrect();
                if (keyBtn) keyBtn.classList.add('key-correct');
                renderWordDisplay();
            } else {
                audio.playWrong();
                if (keyBtn) keyBtn.classList.add('key-wrong');
                
                if (wrongGuesses < MAX_WRONG) {
                    bodyParts[wrongGuesses].visible = true;
                    wrongGuesses++;
                    updateLivesUI();
                }

                if (wrongGuesses >= MAX_WRONG) {
                    endGame(false);
                }
            }
        }

        function updateLivesUI() {
            const livesText = document.getElementById('lives-counter');
            const remaining = MAX_WRONG - wrongGuesses;
            livesText.innerText = `${remaining} / ${MAX_WRONG} Lives`;
            
            if (remaining <= 2) {
                livesText.className = "text-[11px] sm:text-sm font-bold text-red-400 animate-pulse";
            } else {
                livesText.className = "text-[11px] sm:text-sm font-bold text-slate-200";
            }
        }

        function endGame(isWin) {
            gameActive = false;

            const modal = document.getElementById('game-modal');
            const iconContainer = document.getElementById('modal-icon-container');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const subtitle = document.getElementById('modal-subtitle');
            const revealedWord = document.getElementById('revealed-word');

            revealedWord.innerText = currentWordObj.word;

            if (isWin) {
                audio.playWin();
                iconContainer.className = "w-16 h-16 sm:w-20 sm:h-20 mx-auto mb-3 sm:mb-4 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl shadow-lg bg-emerald-500/20 text-emerald-400 border-emerald-500/40";
                icon.className = "fa-solid fa-trophy";
                title.innerText = "VICTORY!";
                title.className = "text-2xl sm:text-3xl font-extrabold tracking-wide mb-1 sm:mb-2 text-emerald-400 glow-text";
                subtitle.innerText = "Fantastic job! You saved the character and solved the mystery word.";
            } else {
                audio.playLoss();
                iconContainer.className = "w-16 h-16 sm:w-20 sm:h-20 mx-auto mb-3 sm:mb-4 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl shadow-lg bg-rose-500/20 text-rose-400 border-rose-500/40";
                icon.className = "fa-solid fa-skull";
                title.innerText = "GAME OVER";
                title.className = "text-2xl sm:text-3xl font-extrabold tracking-wide mb-1 sm:mb-2 text-rose-500";
                subtitle.innerText = "Out of lives! The stick figure has met its tragic end.";
            }

            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
            }, 400);
        }

        function setupEventListeners() {
            // Keyboard Keypress
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                audio.startBGM();
                const key = e.key.toUpperCase();
                if (key >= 'A' && key <= 'Z' && key.length === 1) {
                    makeGuess(key);
                }
            });

            // Quick Reset Button
            document.getElementById('reset-btn').addEventListener('click', () => {
                audio.playClick();
                initGame();
            });

            // Settings Modal Open/Close
            const settingsModal = document.getElementById('settings-modal');
            document.getElementById('settings-btn').addEventListener('click', () => {
                audio.playClick();
                settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            });

            document.getElementById('close-settings-btn').addEventListener('click', () => {
                audio.playClick();
                settingsModal.classList.add('opacity-0', 'pointer-events-none');
            });

            // Play Again Button
            document.getElementById('modal-play-again').addEventListener('click', () => {
                audio.playClick();
                initGame();
            });

            // Audio Controls
            const musicToggle = document.getElementById('music-toggle');
            const musicSlider = document.getElementById('music-vol-slider');
            const sfxSlider = document.getElementById('sfx-vol-slider');

            musicToggle.addEventListener('change', (e) => {
                audio.isMusicOn = e.target.checked;
                audio.updateVolumes();
                if (audio.isMusicOn) audio.startBGM();
            });

            musicSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('music-vol-txt').innerText = `${val}%`;
                audio.musicVol = val / 100;
                audio.updateVolumes();
            });

            sfxSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('sfx-vol-txt').innerText = `${val}%`;
                audio.sfxVol = val / 100;
                audio.updateVolumes();
            });

            // Exit Button Redirect
            document.getElementById('exit-btn').addEventListener('click', () => {
                audio.playClick();
                window.location.href = 'game_hub.html';
            });

            // Initial audio unlock on touch
            window.addEventListener('pointerdown', () => {
                audio.startBGM();
            }, { once: true });
        }

        window.onload = () => {
            initThreeJS();
            setupEventListeners();
            initGame();
        };
    </script>
</body>
</html>
